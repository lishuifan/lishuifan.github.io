    Research:
      - bullet: "**LLM-based Code Generation** — training, evaluation, and optimization methods for code LLMs, including fault-guided fine-tuning, keyword-enhanced prompting, and reasoning-process reward learning."
      - bullet: "**Code-Change Understanding** — systematic studies of LLM capabilities on code review generation, commit message generation, and just-in-time comment update."
      - bullet: "**Industry Collaboration** — core contributor to projects with Huawei and Tencent (CCF-Huawei Populus Grove Fund, Tencent Rhino-Bird special project), translating practical software engineering needs into model training, evaluation, and optimization problems."

